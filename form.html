<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Review Form | WDD 131</title>

    <meta name="author" content="Jorge Lucas da Silva Neto">
    <meta name="description" content="Submit a product review with a rating, installation date, and feature feedback.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <div class="header-container">
            <span class="site-title">Product Review</span>
        </div>
    </header>

    <main>

        <h1>Tell Us What You Think</h1>

        <form action="review.html" method="get" class="review-form">

            <div class="form-group">
                <label for="product-name">Product Name</label>
                <select id="product-name" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <fieldset class="form-group star-rating">
                <legend>Overall Rating <span class="required-note">(required)</span></legend>

                <div class="stars">
                    <input type="radio" id="rating-5" name="rating" value="5" required>
                    <label for="rating-5" title="5 stars">&star;</label>

                    <input type="radio" id="rating-4" name="rating" value="4" required>
                    <label for="rating-4" title="4 stars">&star;</label>

                    <input type="radio" id="rating-3" name="rating" value="3" required>
                    <label for="rating-3" title="3 stars">&star;</label>

                    <input type="radio" id="rating-2" name="rating" value="2" required>
                    <label for="rating-2" title="2 stars">&star;</label>

                    <input type="radio" id="rating-1" name="rating" value="1" required>
                    <label for="rating-1" title="1 star">&star;</label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="install-date">Date of Installation</label>
                <input type="date" id="install-date" name="installDate" required>
            </div>

            <fieldset class="form-group">
                <legend>Useful Features</legend>

                <div class="checkbox-group">
                    <input type="checkbox" id="feature-easy-install" name="features" value="Easy to install">
                    <label for="feature-easy-install">Easy to install</label>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="feature-performance" name="features" value="Great performance">
                    <label for="feature-performance">Great performance</label>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="feature-value" name="features" value="Good value for money">
                    <label for="feature-value">Good value for money</label>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="feature-durable" name="features" value="Durable design">
                    <label for="feature-durable">Durable design</label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="written-review">Written Review</label>
                <textarea id="written-review" name="writtenReview" rows="5" placeholder="Share your experience with this product..."></textarea>
            </div>

            <div class="form-group">
                <label for="user-name">Your Name (optional)</label>
                <input type="text" id="user-name" name="userName" placeholder="Jane Doe">
            </div>

            <div class="form-group">
                <input type="submit" value="Submit Review">
            </div>

        </form>

    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Jorge Lucas da Silva Neto | Brazil</p>
        <p id="lastModified"></p>
    </footer>

</body>

</html>
